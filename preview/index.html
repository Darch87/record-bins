<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dedubs Den of Discs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
html,body{margin:0;padding:0;background:#F6F5F0}
#rb{
  --bg:#F6F5F0; --panel:#FFFFFF; --ink:#16181C; --muted:#4D525B; --line:#1B1D21; --soft:#D6D8D0;
  --ctl:#ECEEF3; --ctlb:#C9CDD8;
  --lab:#FFE36E; --labink:#2A2200; --labb:#D8B82E;
  --accent:#E0442E; --accentink:#FFFFFF; --hi:#DCE8FF; --hiink:#16181C;
  --pat:none; --wood:#B98552; --wood2:#8E5E33;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4;
  height:var(--rb-h,100vh); min-height:480px; box-sizing:border-box; overflow:hidden; position:relative;
  padding:8px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));
  display:grid; gap:8px; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"head nav" "main main";
  -webkit-text-size-adjust:100%; touch-action:pan-y; overscroll-behavior:contain;
}
#rb::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.3;pointer-events:none;z-index:0}
#rb>*{position:relative;z-index:1}
#rb *{box-sizing:border-box}
#rb [hidden]{display:none!important}
#rb button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
#rb button:focus-visible,#rb a:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
#rb input,#rb select{font:400 15px var(--body);color:var(--ink);background:#fff;border:1.5px solid var(--ctlb);border-radius:8px;padding:7px 10px;min-width:0;height:36px}
#rb input:focus,#rb select:focus{outline:2px solid var(--accent);outline-offset:1px}
#rb .note{font-size:13px;color:var(--muted)}
#rb a.lk{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}

/* buttons: light by default, highlighted only when part of the selection */
#rb .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:8px;background:#fff;border:1.5px solid var(--ctlb);font-weight:700;font-size:14px;white-space:nowrap;transition:background-color .15s,border-color .15s}
#rb .btn:hover{background:var(--hi);border-color:var(--line)}
#rb .btn.on{background:var(--hi);color:var(--hiink);border-color:var(--line);box-shadow:inset 0 0 0 1px var(--line)}
#rb .btn.sm{height:30px;padding:0 10px;font-size:13px}
#rb .btn.go{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
#rb .btn.go:hover{filter:brightness(.95)}
#rb .btn.danger{background:#B3261E;color:#fff;border-color:#B3261E}
#rb .btn.danger:hover{background:#8F1D17}
#rb .btn.manage{background:var(--accent);color:var(--accentink);border-color:var(--accent);height:38px;padding:0 16px}
#rb .btn.manage.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--line)}
#rb .btn[disabled]{opacity:.45;cursor:not-allowed}
#rb .seg{display:inline-flex;gap:4px;flex-wrap:wrap}

/* group label: the special color that says what a toolbar does */
#rb .glab{display:inline-flex;align-items:center;height:36px;padding:0 10px;border-radius:8px 0 0 8px;background:var(--lab);color:var(--labink);border:1.5px solid var(--labb);font:800 13px var(--display);letter-spacing:.02em;white-space:nowrap}
#rb .grp{display:inline-flex;align-items:center;gap:5px;background:var(--ctl);border:1.5px solid var(--ctlb);border-radius:10px;padding:0 6px 0 0}
#rb .grp .glab{margin:-1.5px 2px -1.5px -1.5px}
#rb .grp select{height:30px;padding:3px 8px;font-size:14px}
#rb .grp input[type=search]{height:30px;width:170px;padding:3px 9px;font-size:14px}
#rb .grp .btn{height:30px;padding:0 11px;font-size:14px}
#rb .grp.test{opacity:.85}

/* top bar */
#rb .head{grid-area:head;display:flex;align-items:center;gap:14px;min-height:64px;padding:4px 4px 4px 2px}
#rb h1{font:800 clamp(22px,2.8vw,32px)/1 var(--display);margin:0;letter-spacing:-.015em}
#rb .count{font-size:15px;color:var(--muted);white-space:nowrap}
#rb .count b{color:var(--ink);font-size:17px}
#rb .who{font-size:12.5px;color:var(--muted)}
#rb .who button{text-decoration:underline;font-size:12.5px}
#rb .brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#rb .nav{grid-area:nav;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:flex-end;align-content:center}
#rb-main{grid-area:main;min-height:0;min-width:0;display:flex;flex-direction:column}

/* test layout: the main buttons become a panel on the left, title on the right of a thinner bar */
#rb[data-layout="b"]{grid-template-columns:230px minmax(0,1fr);grid-template-areas:"nav head" "nav main"}
#rb[data-layout="b"] .head{min-height:44px;justify-content:flex-end;padding:0 4px}
#rb[data-layout="b"] h1{font-size:22px}
#rb[data-layout="b"] .nav{flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--panel);border:1px solid var(--soft);border-radius:12px;padding:10px;gap:10px;overflow-y:auto}
#rb[data-layout="b"] .grp{flex-direction:column;align-items:stretch;padding:0 0 6px;gap:5px}
#rb[data-layout="b"] .grp .glab{border-radius:8px 8px 0 0;margin:-1.5px -1.5px 2px;height:32px}
#rb[data-layout="b"] .grp>*:not(.glab){margin:0 6px}
#rb[data-layout="b"] .grp input[type=search]{width:auto}

/* panels */
#rb .panel{background:var(--panel);border:1px solid var(--soft);border-radius:12px;position:relative;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column}
#rb .pbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:46px;padding:6px 8px;background:var(--ctl);border-bottom:1.5px solid var(--ctlb)}
#rb .pbar .ptitle{font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase}
#rb .pbar .right{margin-left:auto;font-size:14px;color:var(--muted)}
#rb .pbar .right b{color:var(--ink)}
#rb .sel{color:var(--accent);font-weight:800}
#rb .steps{flex:0 0 auto;display:flex;gap:4px 14px;flex-wrap:wrap;padding:5px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--soft)}
#rb .steps b{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--lab);color:var(--labink);font-size:11px;margin-right:4px;border:1px solid var(--labb)}

/* bin digging layout: bins top left, now playing top right, the open bin across the bottom */
#rb .dig{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.35fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr);gap:8px}
#rb .inbin{grid-column:1 / -1}

/* bins (axonometric, parallel, length to scale) */
#rb .bscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
#rb .bscroll svg{display:block;width:100%}
#rb .bscroll svg text{font-family:var(--body);font-weight:700;paint-order:stroke;stroke-linejoin:round}
#rb .bin{cursor:pointer}
#rb .bin:hover .binfront{filter:brightness(.94)}

/* now playing */
#rb .np{padding:0}
#rb .nptitle{flex:0 0 auto;margin:8px 8px 0;padding:8px 12px;border-radius:10px;background:var(--hi);color:var(--hiink);box-shadow:inset 0 0 0 1.5px var(--line)}
#rb .nptitle .ar{font-weight:700;font-size:15px;line-height:1.2}
#rb .nptitle .al{font:800 clamp(20px,2vw,26px)/1.05 var(--display);margin-top:2px}
#rb .npbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(150px,.8fr) minmax(0,1.3fr);gap:6px;padding:6px 8px 0}
#rb .npleft{display:flex;flex-direction:column;min-height:0;align-items:stretch}
#rb .tt{flex:1;min-height:110px;display:flex;align-items:center;justify-content:center;perspective:none;padding:8px 0 18px}
#rb .axo{transform:rotateX(52deg) rotateZ(-32deg);transform-style:preserve-3d;width:min(100%,280px);aspect-ratio:1.25;position:relative}
#rb .plinth{position:absolute;inset:0;border-radius:6px;background:var(--plinth,#F1F1EC);border:1.2px solid var(--line);transform-style:preserve-3d}
#rb .plinth .f{position:absolute;background:var(--plinth2,#D9D9D2);border:1.2px solid var(--line);backface-visibility:hidden}
#rb .plinth .fb{left:0;right:0;top:100%;height:var(--th,16px);transform-origin:top;transform:rotateX(-90deg)}
#rb .plinth .ft{left:0;right:0;bottom:100%;height:var(--th,16px);transform-origin:bottom;transform:rotateX(90deg)}
#rb .plinth .fr{top:0;bottom:0;left:100%;width:var(--th,16px);transform-origin:left;transform:rotateY(90deg)}
#rb .plinth .fl{top:0;bottom:0;right:100%;width:var(--th,16px);transform-origin:right;transform:rotateY(-90deg)}
#rb .plinth svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#rb .spin{transform-box:fill-box;transform-origin:center}
#rb .spin.on{animation:rbspin 1.8s linear infinite}
@keyframes rbspin{to{transform:rotate(360deg)}}
#rb .arm{transform-box:view-box;transform-origin:262px 46px;transition:transform .6s ease}
#rb .arm.on{transform:rotate(24deg)}
#rb .meta{flex:0 0 auto;font-size:13.5px;line-height:1.35;padding:2px 2px 6px;color:var(--ink)}
#rb .meta .yr{font-weight:800}
#rb .meta .press{display:inline-block;font-weight:800;color:var(--accent);margin-left:2px}
#rb .meta .styles{color:var(--muted)}
#rb .npright{display:flex;flex-direction:column;min-height:0}
#rb .tlist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:2px}
#rb table.tr{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.25}
#rb table.tr th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:3px 3px;border-bottom:1.5px solid var(--line);vertical-align:bottom}
#rb table.tr th.tm{text-align:right}
#rb table.tr th.tm b{display:block;font-size:12px;color:var(--ink);letter-spacing:0;text-transform:none}
#rb table.tr th.dj{text-align:center;width:54px;line-height:1.05}
#rb table.tr td{padding:2px 3px;border-bottom:1px dashed var(--soft);vertical-align:middle}
#rb table.tr tr.sidehead td{border-bottom:0;padding-top:7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
#rb table.tr td.n{width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
#rb table.tr td.tm{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#rb table.tr td.ly{width:46px;text-align:center}
#rb table.tr td.dj{text-align:center}
#rb .ly a{font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:underline}
#rb .ly a:hover{color:var(--ink)}
#rb .play{display:inline-flex;align-items:center;gap:5px;text-align:left}
#rb .play i{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:8px}
#rb .play.has:hover i,#rb .play.on i{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
#rb .play:not(.has) i{visibility:hidden}
#rb .djb{width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;color:transparent;background:#fff}
#rb .djb.on{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
#rb .money{flex:0 0 auto;margin:6px 8px 8px;padding:7px 10px;border-radius:10px;background:var(--ctl);border:1px solid var(--ctlb);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;font-size:13px}
#rb .money .facts{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
#rb .money .facts b{font-size:14px}
#rb .money .facts span{color:var(--muted)}
#rb .wave{display:flex;flex-direction:column;gap:2px;min-width:0}
#rb .wave svg{width:100%;height:44px;display:block}
#rb .wave .cap{font-size:12px;color:var(--muted)}
#rb .wave .cap b{color:var(--ink)}

/* the open bin: crates across the width, each moved with vertical scroll */
#rb .cols{flex:1;min-height:0;display:flex;gap:6px;padding:6px;overflow:hidden}
#rb .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:8px;background:var(--crate,#EFE7DA);overflow:hidden;position:relative}
#rb .collab{flex:0 0 auto;display:flex;justify-content:space-between;gap:6px;align-items:center;font:800 12.5px/1.2 var(--display);padding:4px 8px;border-bottom:1.5px solid var(--line);background:var(--panel);white-space:nowrap;overflow:hidden}
#rb .collab .cur{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:5px;background:var(--hi);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px}
#rb .crate{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;position:relative}
#rb .stage{position:sticky;top:0;left:0;width:100%;overflow:hidden}
#rb .stage .floor{position:absolute;left:0;right:0;height:2px;background:var(--line);opacity:.35}
#rb .card{position:absolute;left:50%;transform-style:preserve-3d;transform-origin:50% 100%;transition:transform .12s linear}
#rb .card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.2px solid var(--line);overflow:hidden}
#rb .card .back{transform:rotateX(180deg);background:var(--bk,#888)}
#rb .card .back img{width:100%;height:100%;object-fit:cover;display:block}
#rb .card.div .front{background:#F3EFE6;border-radius:3px}
#rb .card.div .tab{position:absolute;top:-16%;left:10%;width:34%;height:20%;background:#F3EFE6;border:1.2px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center;font:800 15px var(--display);backface-visibility:hidden}
#rb .card.div .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 42px var(--display);color:var(--line);opacity:.18}
#rb .card.rec{cursor:pointer}
#rb .card.rec.on .front{outline:3px solid var(--accent);outline-offset:2px}
#rb .crate .spacer{width:1px}

/* classic crates (test) */
#rb .classic{padding:10px 12% 60%}
#rb .crec{display:block;width:100%;max-width:170px;margin:0 auto calc(min(100%,170px) * -0.62);aspect-ratio:1;transform:perspective(600px) rotateX(40deg);transform-origin:50% 100%;transition:transform .2s,margin .2s;position:relative;z-index:1;box-shadow:0 7px 0 -1px var(--line)}
#rb .crec:hover,#rb .crec.on{transform:perspective(600px) rotateX(6deg);margin-bottom:4%;z-index:5}
#rb .crec.on{outline:3px solid var(--accent);outline-offset:2px}

/* sleeves */
#rb .sleeve{position:relative;width:100%;height:100%;container-type:inline-size;overflow:hidden;background:var(--s1);color:var(--s3);isolation:isolate}
#rb .sleeve .art{position:absolute;inset:0;z-index:-1}
#rb .sleeve .t{position:absolute;left:7cqw;right:7cqw;font-family:var(--display);line-height:.95;overflow-wrap:anywhere}
#rb .sleeve .a{top:7cqw;font-weight:800;font-size:12.5cqw;text-transform:uppercase}
#rb .sleeve .n{bottom:7cqw;font-weight:500;font-size:8.5cqw;line-height:1.02}
#rb .sleeve.L1 .art{background:radial-gradient(circle at 78% 64%,var(--s2) 0 26%,transparent 26.5%),radial-gradient(circle at 78% 64%,#0b0b0b 0 40%,transparent 40.5%)}
#rb .sleeve.L2 .art{background:repeating-linear-gradient(var(--ang),var(--s2) 0 9cqw,transparent 9cqw 18cqw)}
#rb .sleeve.L3 .art{background:linear-gradient(var(--ang),var(--s1) 0 52%,var(--s2) 52% 100%)}
#rb .sleeve.L4 .art{background:radial-gradient(circle at 30% 70%,var(--s2) 0 34%,transparent 34.5%)}
#rb .sleeve .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
#rb .sleeve .cover.on{opacity:1}

/* pick for me */
#rb .pop{position:absolute;z-index:50;right:10px;top:70px;max-height:calc(100% - 80px);overflow-y:auto;overscroll-behavior:contain;width:min(420px,calc(100% - 20px));background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:10px}
#rb .pop h3{margin:0;font:800 21px var(--display)}
#rb .chips{display:flex;flex-wrap:wrap;gap:5px}
#rb .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
#rb .eras{display:flex;align-items:flex-end;gap:4px;height:118px;padding:0 2px}
#rb .era{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
#rb .era .bar{width:100%;border-radius:5px 5px 2px 2px;background:var(--ctl);border:1.5px solid var(--ctlb);transition:background-color .15s}
#rb .era:hover .bar{background:var(--hi)}
#rb .era.on .bar{background:var(--accent);border-color:var(--line)}
#rb .era .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#rb .era .y{font-size:11.5px;font-weight:800}
#rb .optbar{display:flex;flex-direction:column;gap:6px}
#rb .optbar .btn{width:100%;height:40px;justify-content:flex-start}
#rb .optbar .btn small{font-weight:400;color:var(--muted);margin-left:auto}
#rb .optbar .btn.go small{color:inherit;opacity:.85}

/* DJ playlists: checkout desk on the left, the long wall on the right */
#rb .djmode{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,2fr);gap:8px}
#rb .desk{background:#EFE3CC;border-color:#7A5230}
#rb .desk .pbar{background:#E3D2B0;border-bottom-color:#7A5230}
#rb .deskscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px;display:flex;flex-direction:column;gap:10px}
#rb .djs{display:flex;gap:5px;flex-wrap:wrap}
#rb .posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 10px;padding:4px 2px 6px}
#rb .poster{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:8px;text-align:left;border:1.5px solid var(--line);box-shadow:2px 3px 0 rgba(0,0,0,.25);transform:rotate(var(--r,0deg));transition:transform .15s;overflow:hidden;background:var(--pbg);color:var(--pink)}
#rb .poster::before{content:"";position:absolute;inset:0;background-image:var(--ppat);opacity:.5;z-index:0}
#rb .poster>*{position:relative;z-index:1}
#rb .poster b{font:800 15px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
#rb .poster small{font-size:11px;font-weight:700}
#rb .poster.sticker{aspect-ratio:1;border-radius:50%;align-items:center;justify-content:center;text-align:center;padding:12px}
#rb .poster.sticker b{font-size:13px}
#rb .poster:hover{transform:rotate(0deg) scale(1.03)}
#rb .poster.on{outline:3px solid var(--accent);outline-offset:3px;transform:rotate(0deg)}
#rb .boards{display:flex;flex-direction:column;gap:10px}
#rb .board{display:block;width:100%;text-align:left;background:#151515;background-image:repeating-linear-gradient(180deg,#1E1E1E 0 2px,#111 2px 9px);border:6px solid #6B4A2B;border-radius:6px;padding:8px 10px;color:#F4F1E8;font:700 12.5px/1.55 "Courier New",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.6)}
#rb .board .bt{display:flex;justify-content:space-between;gap:6px;font-size:13.5px;border-bottom:1px solid #444;margin-bottom:4px;padding-bottom:3px}
#rb .board .bt span{color:#FFD84D}
#rb .board ol{margin:0;padding:0;list-style:none}
#rb .board li{display:flex;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rb .board li i{font-style:normal;color:#AAA;flex:0 0 auto}
#rb .board.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--line)}

<body>
<div id="rb" data-layout="a" data-mode="dig">
  <header class="head">
    <div class="brandrow"><h1>Dedubs Den of Discs</h1><span class="count" id="rb-count"></span><button class="btn manage" id="rb-manage" hidden>Manage Records</button></div>
    <div class="who" id="rb-who"></div>
  </header>
  <nav class="nav" id="rb-nav" aria-label="Main"></nav>
  <main id="rb-main"></main>
  <div class="pop" id="rb-pop" hidden></div>
  <div class="modal" id="rb-modal" hidden></div>
  <div class="signin" id="rb-signin" hidden></div>
  <div class="status" id="rb-status" hidden role="status"></div>
</div>
<div id="rb-config" hidden data-write="https://script.google.com/macros/s/AKfycbxWSSxXlp_5k1APHeV0soOzSxFQYRXToDyMGrdQWmAJleUvU-IvjbVp54FLBpcIRDaq/exec"></div>
<script>
(function(){
"use strict";
try{
/* Dedubs Den of Discs, round 5 */
const CFG = document.getElementById("rb-config");
const SHEET_WRITE = (CFG&&CFG.getAttribute("data-write"))||"";
const LIVE = !/claude|anthropic|usercontent/i.test(location.hostname);
const ROOT = document.getElementById("rb");
const $ = s=>ROOT.querySelector(s);
const $$ = s=>[...ROOT.querySelectorAll(s)];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s||"").toLowerCase().replace(/^the\s+/,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"")}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function money(n){ if(n==null||n===""||isNaN(+n)) return ""; n=+n; return "$"+(n%1?n.toFixed(2):String(n)); }
function mk(i,o){o.i=i;o.key=norm(o.artist)+"|"+norm(o.title);return o}
function val(id){ const e=$("#"+id); return e?e.value.trim():""; }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function lenMs(s){ const m=String(s||"").match(/^(\d+):(\d\d)$/); return m?(+m[1]*60+ +m[2])*1000:0; }
function fmtLen(ms){ const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function sortName(r){ return (r.artist||"").replace(/^the\s+/i,"").toLowerCase(); }
function letterOf(r){ const c=sortName(r).charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:"#"; }
function valueOf(r){ return r.value!=null?r.value:r.cost; }
function status(t,ms){ const s=$("#rb-status"); if(!s) return; s.textContent=t; s.hidden=!t; clearTimeout(status.t); if(t&&ms!==0) status.t=setTimeout(()=>s.hidden=true,ms||3500); }

let RECS=[];
let SDB={tracks:{},rel:{},prices:{},details:{},lists:[]};
const DET_MINE={};
let jn=0;
const AUTH={role:ls("rb-role")||"", pass:ls("rb-pass")||"", name:ls("rb-guest")||"", legacy:false};

const MOODS = {
  "Cozy Sunday morning":["Folk","Singer-Songwriter","Soft Rock","Jazz","Easy Listening","Classical","New Age"],
  "Party time":["Funk/Disco","Pop","Soul/R&B","New Wave","Electronic"],
  "Turn it up loud":["Rock","Hard Rock","Prog Rock","Post-Punk"],
  "Dinner with friends":["Jazz","Soul/R&B","Easy Listening","World","Blues","Gospel"],
  "Rainy afternoon":["Folk","Folk Rock","Singer-Songwriter","Blues","Indie","New Age"],
  "Road trip":["Rock","Country","Country Rock","Folk Rock","Soft Rock"],
  "Late night":["Jazz","Blues","Electronic","Experimental","Indie"],
  "Dance in the kitchen":["Funk/Disco","New Wave","Pop","Soul/R&B"],
  "Something odd":["Comedy/Spoken Word","Soundtrack","Experimental","Children's","Holiday"]
};
function valueBand(c){ if(!c) return "No value"; if(c<5) return "Under $5"; if(c<10) return "$5 to 10"; if(c<20) return "$10 to 20"; if(c<40) return "$20 to 40"; return "$40 and up"; }
const VALUE_ORDER=["Under $5","$5 to 10","$10 to 20","$20 to 40","$40 and up","No value"];
const BINBY={
  genre:{label:"Genre",of:r=>r.genre||"Other"},
  year:{label:"Year",of:r=>r.year?Math.floor(r.year/10)*10+"s":"Year ?"},
  coll:{label:"Collection",of:r=>r.coll||"Other"},
  value:{label:"Value",of:r=>valueBand(valueOf(r))}
};
const state={mode:"dig",by:"genre",bin:"",q:"",now:null,pop:false,mood:"",eras:new Set(),view:"bin",flight:[],
  layout:ls("rb-layout")==="b"?"b":"a", crate:ls("rb-crate")==="classic"?"classic":"flip", vibe:ls("rb-vibe")||"auto",
  list:"all", djBy:"", wallBy:"artist"};

/* designed sleeves while the real cover loads */
let HUE={};
function indexHues(){ HUE={}; const n={}; RECS.forEach(r=>n[r.genre]=(n[r.genre]||0)+1); Object.keys(n).sort((a,b)=>n[b]-n[a]).forEach((g,k)=>HUE[g]=Math.round((k*137.5)%360)); }
function hueOf(r){ const b=(r.genre in HUE)?HUE[r.genre]:200; return (b+(hash(r.key)%40)-20+360)%360; }
function sleeve(r){
  const h=hash(r.artist+"|"+r.title), hue=hueOf(r), L=["L1","L2","L3","L4"][h%4], dark=(h>>>3)%3===0;
  const s1=dark?`hsl(${hue} 38% 20%)`:`hsl(${hue} 62% ${70+((h>>>5)%14)}%)`;
  const s2=dark?`hsl(${(hue+40)%360} 70% 58%)`:`hsl(${(hue+180)%360} 55% ${32+((h>>>7)%18)}%)`;
  const s3=dark?`hsl(${hue} 30% 94%)`:`hsl(${hue} 60% 12%)`;
  return `<div class="sleeve ${L}" data-i="${r.i}" style="--s1:${s1};--s2:${s2};--s3:${s3};--ang:${(h>>>9)%180}deg"><div class="art"></div><div class="t a">${esc(r.artist||"Unknown")}</div><div class="t n">${esc(r.title)}</div></div>`;
}
function backColor(r){ const c=COLORS[r.key]; return c&&c[0]?c[0]:`hsl(${hueOf(r)} 40% 42%)`; }
function backFace(r){
  const rel=SDB.rel[r.key];
  return `<div class="face back" style="--bk:${backColor(r)}">${rel&&!NOBACK.has(rel)?`<img alt="" loading="lazy" src="https://coverartarchive.org/release/${esc(rel)}/back-250" onerror="this.remove();window.__rbNoBack&&window.__rbNoBack('${esc(rel)}')">`:""}</div>`;
}
const NOBACK=new Set(ls("rb-noback")||[]);
window.__rbNoBack=id=>{ NOBACK.add(id); if(NOBACK.size%5===0) ls("rb-noback",[...NOBACK].slice(-3000)); };

/* ---------- the sheet ---------- */
function rowsToRecs(rows){
  rows=rows.map(r=>r.map(x=>x==null?"":String(x))); const h=rows.shift().map(x=>x.trim().toLowerCase());
  const col=(...ks)=>{ for(const k of ks){ const a=h.findIndex(x=>x===k); if(a>=0) return a; } for(const k of ks){ const a=h.findIndex(x=>x.startsWith(k)); if(a>=0) return a; } return -1; };
  const A=col("artist","album artist"), T=h.findIndex(x=>(x.startsWith("album")||x.startsWith("title"))&&!x.includes("artist")), Y=col("year"), G=col("genre"), S=col("collection","shelf"), F=col("from","source"), C=col("cost"), V=col("value","resale"), Q=h.findIndex(x=>x==="quality"||x==="condition"), CV=col("cover");
  const g=(r,k)=>k<0?"":(r[k]||"").trim(), num=s=>{ const n=parseFloat(String(s).replace(/[$,]/g,"")); return isFinite(n)&&n>0?n:null; };
  return rows.filter(r=>g(r,A)||g(r,T)).map((r,i)=>{ const y=parseInt(g(r,Y),10); return mk(i,{artist:g(r,A),title:g(r,T),year:y>1800&&y<2100?y:null,genre:g(r,G)||"Other",coll:g(r,S),from:g(r,F),cost:num(g(r,C)),value:num(g(r,V)),quality:g(r,Q),cover:g(r,CV)}); });
}
function applyLoad(d,fromCache){
  if(!d||!d.records||d.records.length<2) return false;
  const got=rowsToRecs(d.records); if(!got.length) return false;
  const keepNow=state.now!=null&&RECS[state.now]?RECS[state.now].key:null;
  RECS=got;
  SDB={tracks:d.tracks||{},rel:d.rel||{},prices:d.prices||{},details:Object.assign({},d.details||{},DET_MINE),lists:d.lists||[]};
  indexHues();
  state.now=keepNow?(RECS.find(r=>r.key===keepNow)||{i:null}).i:null;
  return true;
}
function saveCache(d){ try{ localStorage.setItem("rb-cache",JSON.stringify({t:Date.now(),d})); }catch(e){ try{ localStorage.removeItem("rb-cache"); }catch(x){} } }
function readCache(){ try{ const c=JSON.parse(localStorage.getItem("rb-cache")||"null"); return c&&c.d?c.d:null; }catch(e){ return null; } }

async function api(action,body,pass){
  const r=await fetch(SHEET_WRITE,{method:"POST",body:JSON.stringify(Object.assign({passcode:pass||AUTH.pass,action},body||{}))});
  return r.json();
}
/* old script (before this update): the record list comes from the public read */
function legacyGet(){
  return new Promise((res,rej)=>{
    const cb="__rbdb"+(jn++), s=document.createElement("script"); let done=false;
    const fin=(v,e)=>{ if(done) return; done=true; try{delete window[cb]}catch(x){} s.remove(); e?rej(e):res(v); };
    window[cb]=d=>fin(d); s.onerror=()=>fin(null,new Error("blocked")); setTimeout(()=>fin(null,new Error("no answer")),45000);
    s.src=SHEET_WRITE+(SHEET_WRITE.indexOf("?")>=0?"&":"?")+"callback="+cb; document.head.appendChild(s);
  });
}
async function signIn(pass,name){
  let d; try{ d=await api("auth",{name},pass); }catch(e){ return {ok:false,error:"Couldn't reach the sheet. Check your connection and try again."}; }
  if(d&&d.ok) return {ok:true,role:d.role};
  if(d&&d.error==="Unknown action.") return {ok:true,role:"admin",legacy:true};
  return {ok:false,error:d&&d.error==="Wrong passcode."?"That passcode didn't work.":(d&&d.error)||"That didn't work."};
}
async function loadAll(){
  let d=null;
  if(AUTH.legacy){ const g=await legacyGet(); d=Object.assign({lists:[],details:{},rel:{}},g); }
  else{ d=await api("load"); if(d&&d.error==="Unknown action."){ AUTH.legacy=true; return loadAll(); } }
  if(!d||d.ok===false) throw new Error(d&&d.error||"no data");
  if(d.role&&d.role!==AUTH.role){ AUTH.role=d.role; ls("rb-role",AUTH.role); }
  if(applyLoad(d)) saveCache(d);
  return d;
}

/* writes that every signed-in visitor helps with: track lists, prices, covers, Discogs details */
const WQ={tracks:[],prices:[],covers:[],details:[]}; let wqT=null;
function queueWrite(kind,item){ if(!AUTH.pass||!SHEET_WRITE) return; if(AUTH.legacy&&kind==="details") return; WQ[kind].push(item); clearTimeout(wqT); wqT=setTimeout(flushWrites,15000); }
function flushWrites(){
  if(!AUTH.pass||!SHEET_WRITE) return;
  Object.keys(WQ).forEach(kind=>{ const items=WQ[kind].splice(0); if(!items.length) return;
    fetch(SHEET_WRITE,{method:"POST",mode:"no-cors",keepalive:true,body:JSON.stringify({passcode:AUTH.pass,action:kind,items})}).catch(()=>{}); });
}
window.addEventListener("pagehide",flushWrites);

/* ---------- lookups (in the visitor's browser, cached, saved back to the sheet) ---------- */
const MB="https://musicbrainz.org/ws/2/";
const INFO=ls("rb-info")||{};
let mbChain=Promise.resolve();
/* MusicBrainz allows about one call a second; when it says "busy" (503), wait and try again */
async function mbTry(url){ for(let t=0;t<3;t++){ try{ const r=await fetch(url,{headers:{Accept:"application/json"}}); if(r.status===503){ await wait(2500*(t+1)); continue; } return r.ok?await r.json():null; }catch(e){ await wait(2000); } } return null; }

const GRADES=[["Poor (P)","P"],["Fair (F)","F"],["Good (G)","G"],["Good Plus (G+)","G+"],["Very Good (VG)","VG"],["Very Good Plus (VG+)","VG+"],["Near Mint (NM or M-)","NM"],["Mint (M)","M"]];
function waveSVG(sug,lowest){
  const pts=GRADES.map(([k,s],i)=>({s,i,v:sug&&sug[k]!=null?+sug[k]:null})).filter(p=>p.v!=null);
  if(pts.length<2) return "";
  const W=300,H=44,lo=Math.min(...pts.map(p=>p.v),lowest?+lowest:Infinity),hi=Math.max(...pts.map(p=>p.v),lowest?+lowest:0)||1;
  const X=i=>10+i*(W-20)/7, Y=v=>H-12-(hi>lo?(v-lo)/(hi-lo):0.5)*(H-20);
  let d=`M${X(pts[0].i)} ${Y(pts[0].v)}`;
  for(let k=1;k<pts.length;k++){ const a=pts[k-1],b=pts[k],mx=(X(a.i)+X(b.i))/2; d+=` C${mx} ${Y(a.v)} ${mx} ${Y(b.v)} ${X(b.i)} ${Y(b.v)}`; }
  const area=d+` L${X(pts[pts.length-1].i)} ${H-12} L${X(pts[0].i)} ${H-12} Z`;
  const acc=cssv("--accent","#E0442E");

   ${pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="2.6" fill="#fff" stroke="${acc}" stroke-width="1.5"><title>${p.s}: ${money(p.v)}</title></circle>`).join("")}
   ${lowest?`<line x1="10" x2="${W-10}" y1="${Y(+lowest)}" y2="${Y(+lowest)}" stroke="#1B1D21" stroke-dasharray="3 3" stroke-width="1"/>`:""}
   ${GRADES.map(([k,s],i)=>`<text x="${X(i)}" y="${H-1}" text-anchor="middle" style="font:700 8.5px sans-serif;fill:#4D525B">${s}</text>`).join("")}
  </svg>`;
}

/* ---------- in the bin: crates across the width; scroll up to dig through each one ---------- */
function inBinList(){

function makeCrate(col,recs){
  const items=[]; let last="";
  recs.forEach(r=>{ const L=letterOf(r); if(L!==last&&state.view!=="flight"){ items.push({div:L}); last=L; } items.push({r}); });
  const sc=col.querySelector(".crate"), stage=col.querySelector(".stage"), spacer=col.querySelector(".spacer"), cur=col.querySelector(".cur");
  const C={items,sc,stage,nodes:new Map(),pos:0,S:100,STEP:70};
  function size(){
    const H=sc.clientHeight||300, Wd=sc.clientWidth||170;
    C.S=Math.max(60,Math.min(Wd*0.78,H/2.45)); C.STEP=Math.max(40,C.S*0.55); C.H=H; C.W=Wd;
    stage.style.height=H+"px"; spacer.style.height=Math.round((items.length-1)*C.STEP)+"px";
    C.hinge=Math.round(Math.min(H*0.56,C.S*0.42+C.S+12));
  }
  function node(j){
    let el=C.nodes.get(j); if(el) return el;
    const it=items[j]; el=document.createElement("div");
    if(it.div){ el.className="card div"; el.innerHTML=`<div class="face front"><div class="big">${it.div}</div></div><div class="tab">${it.div}</div><div class="face back" style="--bk:#E9E3D6"></div>`; }
    else { const r=it.r; el.className="card rec"+(state.now===r.i?" on":""); el.dataset.i=r.i; el.setAttribute("role","button"); el.setAttribute("aria-label",r.artist+", "+r.title);
      el.innerHTML=`<div class="face front">${sleeve(r)}</div>`; }

  }
  function paint(){
    const max=Math.max(0,sc.scrollHeight-sc.clientHeight);
    C.pos=Math.max(0,Math.min(items.length-1,(max-sc.scrollTop)/C.STEP));
    const lo=Math.max(0,Math.floor(C.pos)-2), hi=Math.min(items.length-1,Math.floor(C.pos)+7), keep=new Set();
    const S=C.S, x=-S/2, base=C.hinge;
    for(let j=lo;j<=hi;j++){
      const d=j-C.pos; if(d<-2) continue; keep.add(j);
      const el=node(j), it=items[j];
      el.style.width=S+"px"; el.style.height=S+"px"; el.style.marginLeft=x+"px";
      let ty=base-S, tx=0, rot=0, z=1000-j, op=1;
      if(d>=0){ ty-=d*S*0.075; tx=d*S*0.035; if(d>6) op=Math.max(0,7-d); }
      else { rot=-180*Math.min(1,-d); z=2000+j; op=d<-1.6?Math.max(0,(d+2)/0.4):1; }
      if(it.r&&state.now===it.r.i) ty-=S*0.16;

      el.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotateX(${rot.toFixed(1)}deg)`;
      if(rot<-60&&it.r&&!el.querySelector(".back")) el.insertAdjacentHTML("beforeend",backFace(it.r));
    }
    C.nodes.forEach((el,j)=>{ if(!keep.has(j)){ el.remove(); C.nodes.delete(j); } });
    let L="#"; for(let j=Math.round(C.pos);j>=0;j--){ if(items[j].div){ L=items[j].div; break; } if(items[j].r){ L=letterOf(items[j].r); break; } }
    cur.textContent=L;
  }

  let raf=0, snapT=0, snapping=false;
  sc.addEventListener("scroll",()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; paint(); });
    clearTimeout(snapT); if(snapping){ snapping=false; return; }
    snapT=setTimeout(()=>{ const k=Math.round(C.pos); if(Math.abs(k-C.pos)>0.02){ snapping=true; C.goTo(k); } },180); },{passive:true});

  if(window.ResizeObserver){ let lastH=0; new ResizeObserver(()=>{ const h=sc.clientHeight; if(!h||h===lastH) return; const keepPos=C.pos; lastH=h; size(); stage.style.perspective=(C.S*5)+"px"; stage.style.perspectiveOrigin=`50% ${C.hinge}px`; C.goTo(Math.round(keepPos)); paint(); }).observe(sc); }
  stage.style.perspective=(C.S*5)+"px"; stage.style.perspectiveOrigin=`50% ${C.hinge}px`;

  stage.addEventListener("click",e=>{ const el=e.target.closest(".card"); if(!el) return; const j=+el.dataset.j;

  C.resize=()=>{ const k=Math.round(C.pos); size(); C.goTo(k); paint(); };
  return C;
}

/* the wall: records left to right on shelves, moved by scrolling up and down */
const WALL={list:[],nodes:new Map(),props:[]};
const PROPS=["gumball","sticker","cassettes","cds","sale","poster"];
function propSVG(kind,S,h){
  const w=Math.round(S*0.62);
  if(kind==="gumball") return {w,h:Math.round(S*0.9),svg:`<svg viewBox="0 0 60 90" width="${w}" height="${Math.round(S*0.9)}"><circle cx="30" cy="28" r="24" fill="rgba(255,255,255,.7)" stroke="#3A2A1C" stroke-width="2"/>${[[20,20,"#E0442E"],[34,32,"#FFD84D"],[38,18,"#3A8F5C"],[24,36,"#2E5E8C"],[30,26,"#F2A07B"]].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="5" fill="${c}"/>`).join("")}<rect x="18" y="50" width="24" height="26" fill="#C8361F" stroke="#3A2A1C" stroke-width="2"/><rect x="12" y="76" width="36" height="10" fill="#3A2A1C"/></svg>`};
  if(kind==="sticker") return {w:Math.round(S*0.4),h:Math.round(S*0.4),svg:`<svg viewBox="0 0 40 40" width="${Math.round(S*0.4)}" height="${Math.round(S*0.4)}"><circle cx="20" cy="20" r="18" fill="#FFD84D" stroke="#3A2A1C" stroke-width="1.5"/><text x="20" y="24" text-anchor="middle" style="font:800 11px sans-serif;fill:#2A2200">${["NEW","$5","RARE","USED"][h%4]}</text></svg>`};
  if(kind==="cassettes") return {w,h:Math.round(S*0.42),svg:`<svg viewBox="0 0 60 42" width="${w}" height="${Math.round(S*0.42)}">${[0,1,2].map(k=>`<g transform="translate(${k*3},${k*-12+24})"><rect width="50" height="14" rx="2" fill="${["#2E5E8C","#C8361F","#141414"][k]}" stroke="#3A2A1C"/><rect x="8" y="3" width="34" height="8" fill="#F5E9C8"/></g>`).join("")}</svg>`};
  if(kind==="cds") return {w,h:Math.round(S*0.5),svg:`<svg viewBox="0 0 60 50" width="${w}" height="${Math.round(S*0.5)}">${[0,1,2,3].map(k=>`<rect x="${k*4}" y="${k*-3+14}" width="40" height="34" fill="${["#7B3FA0","#3A8F5C","#FFD84D","#E8E8E8"][k]}" stroke="#3A2A1C" transform="rotate(${k*3-4} 30 30)"/>`).join("")}</svg>`};
  if(kind==="sale") return {w,h:Math.round(S*0.7),svg:`<svg viewBox="0 0 60 70" width="${w}" height="${Math.round(S*0.7)}"><path d="M30 2v14" stroke="#3A2A1C" stroke-width="2"/><rect x="4" y="16" width="52" height="50" fill="#C8361F" stroke="#3A2A1C" stroke-width="2" transform="rotate(-6 30 40)"/><text x="30" y="38" text-anchor="middle" transform="rotate(-6 30 40)" style="font:800 13px sans-serif;fill:#FFF8EC">SALE</text><text x="30" y="56" text-anchor="middle" transform="rotate(-6 30 40)" style="font:800 12px sans-serif;fill:#FFD84D">${["$5","2 FOR 1","20%"][h%3]}</text></svg>`};
  return {w,h:Math.round(S*0.85),svg:`<svg viewBox="0 0 60 85" width="${w}" height="${Math.round(S*0.85)}"><rect x="2" y="2" width="56" height="80" fill="#2E5E8C" stroke="#3A2A1C" stroke-width="2" transform="rotate(4 30 42)"/><circle cx="30" cy="34" r="16" fill="#FFD84D" transform="rotate(4 30 42)"/><text x="30" y="70" text-anchor="middle" transform="rotate(4 30 42)" style="font:800 9px sans-serif;fill:#FFF8EC">LIVE FRI</text></svg>`};
}
function buildWall(){
  const sc=$("#rb-wscroll"); if(!sc) return;
  WALL.list=wallList(); WALL.nodes.clear();
  const track=$("#rb-wtrack"); track.innerHTML="";
  const H=sc.clientHeight||420, Wv=sc.clientWidth||700;
  const R=Math.max(1,Math.round((H-34)/160)), S=Math.max(70,Math.min(170,(H-34)/R-30)), CW=S+20;
  const cols=Math.ceil(WALL.list.length/R), total=Math.max(Wv,40+cols*CW);

  $("#rb-wstage").style.height=H+"px";
  $("#rb-wspace").style.height=Math.max(0,total-Wv)+"px";
  track.style.width=total+"px";
  let sh=""; for(let row=0;row<R;row++){ const y=12+row*(S+30)+S+2; sh+=`<div class="shelf" style="top:${y}px;width:${total}px"></div>`; }
  track.insertAdjacentHTML("beforeend",sh+`<div class="wfloor" style="width:${total}px"></div>`);
  WALL.props=[]; for(let c=5;c<cols;c+=6+(hash("p"+c)%4)){ const h=hash("w"+c), row=h%R, kind=PROPS[h%PROPS.length], p=propSVG(kind,S,h);

  if(!WALL.list.length) track.insertAdjacentHTML("beforeend",`<div class="wempty" style="width:${Wv}px">${listItems()?"None of this playlist's records are in the library yet.":"Nothing matches the search."}</div>`);

  if(!sc._bound){ sc._bound=1; let raf=0; sc.addEventListener("scroll",()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; paintWall(); }); },{passive:true}); bindWall(); }
}
function paintWall(){
  const sc=$("#rb-wscroll"), track=$("#rb-wtrack"); if(!sc||!track) return;

    const k=c*WALL.R+row, r=WALL.list[k]; if(!r) continue; keep.add(k);

function flipRec(el,on){
  if(on&&!el.querySelector(".back")){ const r=RECS[+el.dataset.i]; if(r) el.querySelector(".inner").insertAdjacentHTML("beforeend",backFace(r)); }
  el.classList.toggle("flip",on);

function bindWall(){
  const track=$("#rb-wscroll"); let lastPT="mouse";
  track.addEventListener("pointerdown",e=>{ lastPT=e.pointerType||"mouse"; },true);
  track.addEventListener("mouseover",e=>{ const el=e.target.closest(".wrec"); if(!el||el._hov) return; el._hov=1; el._t=setTimeout(()=>flipRec(el,true),600); });

  track.addEventListener("click",e=>{ const el=e.target.closest(".wrec"); if(!el) return;

/* gatefold: side A on the left, side B on the right */
function openGate(r){
  if(!r) return;
  const m=$("#rb-modal"), items=listItems()||[], hl=new Set(items.filter(x=>norm(x.artist)+"|"+norm(x.album)===r.key).map(x=>norm(x.t)));
  DJ.filter(x=>x.k&&x.k.startsWith(r.key+"|")).forEach(x=>{ if(state.list==="draft") hl.add(norm(x.t)); });
  const cov=coverOf(r);
  m.innerHTML=`<div class="gate" role="dialog" aria-modal="true" aria-label="${esc(r.artist+", "+r.title)}">
   <div class="gatehead">${cov?`<img src="${esc(cov)}" alt="">`:`<div class="sw" style="background:${backColor(r)}"></div>`}<div class="t">${esc(r.artist)}<b>${esc(r.title)}</b></div>
    <button class="btn sm go" id="rb-gplay">Put it on</button><button class="btn sm" id="rb-gx">Close</button></div>
   <div class="leaves"><div class="leaf l"><p class="note">Looking up the tracklist…</p></div><div class="leaf r"></div></div></div>`;
  m.hidden=false;
  const close=()=>{ m.hidden=true; m.innerHTML=""; document.removeEventListener("keydown",esck); };
  const esck=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esck);
  m.onclick=e=>{ if(e.target===m) close(); };
  $("#rb-gx").onclick=close;
  $("#rb-gplay").onclick=()=>{ close(); state.mode="dig"; renderAll(); play(r.i); };
  $("#rb-gx").focus();
  lookup(r).then(info=>{ if(m.hidden) return;
    const L=m.querySelector(".leaf.l"), Rt=m.querySelector(".leaf.r"); if(!L) return;
    if(!info||!info.sides||!info.sides.length){ L.innerHTML=`<p class="note">No tracklist found for this pressing yet.</p>`; return; }
    const side=s=>`<h4>${esc(s.name)}</h4><ol>${s.tracks.map(t=>`<li class="${hl.has(norm(t.t))?"hl":""}"><span class="n">${esc(t.n)}</span><span>${esc(t.t)}</span><span class="tm">${t.len?fmtLen(t.len):""}</span></li>`).join("")}</ol>`;
    let sides=info.sides;
    if(sides.length===1&&sides[0].tracks.length>3){ const t=sides[0].tracks, h=Math.ceil(t.length/2); sides=[{name:"First half",tracks:t.slice(0,h)},{name:"Second half",tracks:t.slice(h)}]; }
    L.innerHTML=sides.filter((s,k)=>k%2===0).map(side).join(""); Rt.innerHTML=sides.filter((s,k)=>k%2===1).map(side).join("")||`<p class="note">That's the whole record.</p>`;
  });
}

function setAuto(id,v){ const e=$("#"+id); if(!e||e.value||v==null||v==="") return; e.value=v; e.classList.add("auto"); e.addEventListener("input",()=>e.classList.remove("auto"),{once:true}); }
function setGenre(g){ if(!g) return; const s=$("#ad-genre"); if(!s||s.value!=="__auto") return; g=GENRE_MAP[g]||g;

  s.value=o.value; s.classList.add("auto"); }
function setPress(p){ const s=$("#ad-press"); if(s&&!s.value&&p){ s.value=p; s.classList.add("auto"); } }
/* catalog number: MusicBrainz knows the catalog number of each pressing */
const credit=x=>(x["artist-credit"]||[]).map(c=>c.name+(c.joinphrase||"")).join("");
async function catLookup(cat){
  const tight=cat.replace(/[\s\-.]/g,"");
  const qy=`catno:${qq(cat)}`+(tight!==cat?` OR catno:${qq(tight)}`:"");
  const d=await mbGet(`${MB}release?query=${encodeURIComponent(qy)}&fmt=json&limit=15`);
  const want=norm(cat).replace(/^0+/,"");
  return ((d&&d.releases)||[]).filter(x=>(x["label-info"]||[]).some(l=>norm(l["catalog-number"]||"").replace(/^0+/,"")===want));
}
function useCatRel(x){
  catRel=x; $("#ad-cats").innerHTML="";
  const a=$("#ad-artist"), b=$("#ad-album");
  if(!a.value){ a.value=credit(x); a.classList.add("auto"); }
  if(!b.value){ b.value=x.title||""; b.classList.add("auto"); }
  const li=(x["label-info"]||[]).find(l=>l.label&&l.label.name); if(li) setAuto("ad-label",li.label.name);
  $("#ad-look").disabled=false;
}
async function addLookup(){
  if(!LIVE){ $("#ad-found").textContent="Look up works on the live page."; return false; }
  const cat=val("ad-cat");
  if(cat&&!catRel){
    $("#ad-found").textContent="Looking up the catalog number…";
    const hits=await catLookup(cat);
    if(!hits.length){ $("#ad-found").textContent="No pressing found with that catalog number. Check it, or type the artist and album."; if(!(val("ad-artist")&&val("ad-album"))) return false; }
    else{
      const aa=norm(val("ad-artist")), list=aa?hits.filter(x=>norm(credit(x)).includes(aa)||aa.includes(norm(credit(x)))):hits;
      const pool=list.length?list:hits, titles=[...new Set(pool.map(x=>norm(credit(x))+"|"+norm(x.title)))];
      if(titles.length>1){
        $("#ad-found").textContent="More than one record has that catalog number. Pick yours:";
        $("#ad-cats").innerHTML=pool.slice(0,6).map((x,i)=>`<button class="btn sm" data-c="${i}">${esc(credit(x))}, ${esc(x.title)}${x.date?" ("+esc(x.date.slice(0,4))+")":""}</button>`).join("");
        $$("#ad-cats [data-c]").forEach(bt=>bt.onclick=()=>{ useCatRel(pool[+bt.dataset.c]); addLookup(); });
        return false;
      }
      useCatRel(pool.find(x=>(x.media||[]).some(m=>/vinyl/i.test(m.format||"")))||pool[0]);
    }
  }
  const artist=val("ad-artist"), album=val("ad-album"); if(!artist||!album) return false;
  const f=$("#ad-found"), mine=val("ad-year"); f.textContent="Looking it up…";
  const hit=await itunesHit({artist,title:album});
  if(hit){ setAuto("ad-cover",hit.artworkUrl100.replace("100x100bb","600x600bb")); setGenre(hit.primaryGenreName); }
  let dg=null; if(!AUTH.legacy){ try{ dg=await api("discogs",{artist,album,year:mine,save:false}); }catch(e){} }
  if(dg&&dg.ok){ addDet=dg; setAuto("ad-styles",dg.styles); setAuto("ad-label",dg.label); setPress(dg.press);
    const sug=dg.suggested&&(dg.suggested["Very Good Plus (VG+)"]||dg.suggested["Near Mint (NM or M-)"]); setAuto("ad-value",sug||dg.lowest||""); }
  const rels=await findReleases(artist,album);
  const ys=[...new Set(rels.map(x=>(x.date||"").slice(0,4)).filter(Boolean))].sort();
  if(!mine){ const y=(catRel&&(catRel.date||"").slice(0,4))||(dg&&dg.firstYear)||ys[0]||(hit&&hit.releaseDate&&hit.releaseDate.slice(0,4)); setAuto("ad-year",y); }
  $("#ad-years").innerHTML=!mine&&ys.length>1?`<span class="lab" style="width:100%">Other years it came out:</span>`+ys.map(y=>`<button class="btn sm" data-y="${y}">${y}</button>`).join(""):"";
  $$("#ad-years [data-y]").forEach(b=>b.onclick=()=>{ $("#ad-year").value=b.dataset.y; $$("#ad-years [data-y]").forEach(x=>x.classList.toggle("on",x===b)); });
  const rel=catRel||bestRelease(rels,val("ad-year"));
  if(catRel&&!val("ad-cover")){ const u=`https://coverartarchive.org/release/${catRel.id}/front-500`; if(await new Promise(ok=>{ const im=new Image(); im.onload=()=>ok(true); im.onerror=()=>ok(false); setTimeout(()=>ok(false),12000); im.src=u; })) setAuto("ad-cover",u); }
  addInfo=rel?await releaseInfo(rel.id):null;
  if(addInfo){ const tot=[].concat(...addInfo.sides.map(s=>s.tracks)).reduce((a,t)=>a+(t.len||0),0); if(tot) setAuto("ad-runtime",fmtLen(tot)); }
  if(dg&&dg.ok) setAuto("ad-runtime",dg.runtime);
  const n=addInfo?addInfo.sides.reduce((a,s)=>a+s.tracks.length,0):0;
  const got=[catRel&&"pressing from the catalog number",hit&&"cover and genre",dg&&dg.ok&&"Discogs details",n&&`${n} tracks`].filter(Boolean);
  f.textContent=got.length?`Found the ${got.join(", ")}. Check the fields, then Add to Library.`:"Nothing found. Check the spelling, or fill it in yourself.";
  return got.length>0;
}

  return {artist,album,year:val("ad-year"),genre,collection:coll,shelf:coll,from:val("ad-from"),source:val("ad-from"),value:val("ad-value").replace(/^\$/,""),quality:val("ad-quality"),cover:val("ad-cover")};
}
async function addSave(){
  if(!val("ad-artist")||!val("ad-album")){ alertBox("ad-msg","bad","Fill in the artist and album first."); return; }
  const pass=val("ad-pass"); if(!pass){ alertBox("ad-msg","bad","Type your passcode first."); return; }
  if(!addInfo&&!addDet&&LIVE){ alertBox("ad-msg","info","Looking up the blank fields first…"); await addLookup(); }
  const row=addRow(), key=norm(row.artist)+"|"+norm(row.album);
  if(RECS.some(r=>r.key===key)&&!$("#ad-save").dataset.again){ $("#ad-save").dataset.again="1"; alertBox("ad-msg","info",`${esc(row.album)} is already in your library. Press Add to Library again to add a second copy.`); return; }
  alertBox("ad-msg","info","Adding…");
  try{ const d=await api("add",{row},pass);
    if(!d||!d.ok){ alertBox("ad-msg","bad",esc(d&&d.error||"The sheet said no. Check the passcode.")); return; }

    if(!AUTH.legacy&&(det.styles||det.label||det.press||det.runtime)){ api("details",{items:[det]},pass).catch(()=>{}); SDB.details[key]=DET_MINE[key]=det; }

    renderManage(); alertBox("ad-msg","ok",`Added <b>${esc(row.album)}</b> by ${esc(row.artist)} to your library.`);
  }catch(e){ alertBox("ad-msg","bad","Couldn't reach your sheet. Try again in a minute."); }

/* fill missing tracklists and covers (runs in this browser, saves to the sheet) */
const TRIED=ls("rb-tried2")||{}, CAAT=ls("rb-caa2")||{};
const FILL={on:false,done:0,total:0,found:0,cov:0,msg:""};
function needT(r){ return !(SDB.tracks[r.key]&&SDB.tracks[r.key].length)&&!TRIED[r.key]; }
function needC(r){ return !r.cover&&(COVERS[r.key]===undefined||(!COVERS[r.key]&&!CAAT[r.key])); }
function fillUI(){
  const n=$("#fill-note"), bar=$("#fill-bar"), go=$("#fill-go"); if(!n) return;
  const left=RECS.filter(r=>needT(r)||needC(r)).length;
  if(go) go.textContent=FILL.on?"Stop":(FILL.done?"Keep filling":"Start filling");
  if(bar) bar.style.width=(FILL.total?Math.round(100*FILL.done/FILL.total):0)+"%";
  n.textContent=FILL.msg||(FILL.on||FILL.done?`Checked ${FILL.done} of ${FILL.total}. Found ${FILL.found} tracklists and ${FILL.cov} covers.`+(FILL.on?" Working…":` ${left} albums still to check.`):`${left} of ${RECS.length} albums still need a tracklist or cover.`);
}
async function fillRun(){
  const todo=RECS.filter(r=>needT(r)||needC(r)); FILL.total=todo.length; FILL.done=0; FILL.found=0; FILL.cov=0; fillUI();
  for(const r of todo){
    if(!FILL.on) break;
    if(needT(r)){ const info=await lookup(r); if(info&&info.sides&&info.sides.length) FILL.found++; else { TRIED[r.key]=1; ls("rb-tried2",TRIED); } }
    if(needC(r)&&FILL.on){ let url=COVERS[r.key]===undefined?await itunesCover(r):0;
      if(url===0||url===""){ const c=await caaCover(r); if(c!==null){ CAAT[r.key]=1; ls("rb-caa2",CAAT); if(c) url=c; } }
      if(url!==null){ COVERS[r.key]=url; ls("rb-covers",COVERS); if(url){ FILL.cov++; queueWrite("covers",{key:r.key,artist:r.artist,album:r.title,cover:url}); } } await wait(1500); }
    FILL.done++; if(FILL.done%10===0) flushWrites(); fillUI();
  }
  FILL.on=false; flushWrites(); fillUI();
}

/* fit the page to the window; on phones the page scrolls down instead */
function fit(){
  const phone=window.innerWidth<=780;
  document.documentElement.style.overflow=document.body.style.overflow=phone?"auto":"hidden";
  if(phone){ ROOT.style.removeProperty("--rb-h"); return; }
  ROOT.style.setProperty("--rb-h",Math.max(520,window.innerHeight)+"px");
}
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ fit();
  if(state.mode==="dig"){ renderBins(); renderInBin(); } else if(state.mode==="dj") buildWall(); },150); });

/* ---------- sign in ---------- */
function showSignIn(msg){
  const s=$("#rb-signin"); s.hidden=false;
  s.innerHTML=`<form class="signbox" id="rb-sform"><h1>Dedubs Den of Discs</h1>
   <div class="note">A private record store for friends. Sign in with the passcode you were given.</div>
   <label>Your name<input id="si-name" autocomplete="nickname" placeholder="Shown on playlists you save" value="${esc(AUTH.name)}"></label>
   <label>Passcode<input id="si-pass" type="password" autocomplete="current-password" required></label>
   <button class="btn go" type="submit" id="si-go">Come in</button>
   <div id="si-msg">${msg?`<div class="alert bad">${esc(msg)}</div>`:""}</div></form>`;
  $("#rb-sform").onsubmit=async e=>{ e.preventDefault();
    const pass=val("si-pass"), name=val("si-name"); if(!pass) return;
    if(!SHEET_WRITE){ alertBox("si-msg","bad","This page isn't connected to the sheet yet."); return; }
    $("#si-go").disabled=true; alertBox("si-msg","info","Checking…");
    const res=await signIn(pass,name);
    if(!res.ok){ $("#si-go").disabled=false; alertBox("si-msg","bad",esc(res.error)); return; }
    if(res.role==="guest"&&!name){ $("#si-go").disabled=false; alertBox("si-msg","bad","Type your name too, so your playlists show who made them."); $("#si-name").focus(); return; }
    Object.assign(AUTH,{pass,role:res.role,name,legacy:!!res.legacy}); ls("rb-pass",pass); ls("rb-role",res.role); ls("rb-guest",name);
    alertBox("si-msg","info","Opening the store…");
    try{ await loadAll(); }catch(err){ $("#si-go").disabled=false; alertBox("si-msg","bad","Signed in, but the record list didn't load. Try again in a minute."); return; }
    s.hidden=true; s.innerHTML=""; start();
  };
  setTimeout(()=>{ const p=$("#si-pass"); if(p) p.focus(); },50);
}
function signOut(){
  ["rb-pass","rb-role","rb-cache"].forEach(k=>ls(k,null));
  Object.assign(AUTH,{pass:"",role:"",legacy:false}); RECS=[]; SDB={tracks:{},rel:{},prices:{},details:{},lists:[]};
  $("#rb-nav").innerHTML=""; $("#rb-main").innerHTML=""; updateCount(); showSignIn();
}
let started=false;
function start(){
  started=true;
  $("#rb-nav").innerHTML=navHTML(); bindNav();
  if(state.mode==="manage"&&AUTH.role!=="admin") state.mode="dig";
  renderAll();
}
async function init(){
  fit();
  ROOT._rb={st:()=>state,recs:()=>RECS,sdb:()=>SDB,auth:()=>AUTH,play,openGate,renderAll,buildWall,CRATES,WALL};
  /* a passcode saved by an older page has no role with it: ask to sign in again */
  if(AUTH.pass&&AUTH.role!=="admin"&&AUTH.role!=="guest"){ ["rb-pass","rb-role","rb-cache"].forEach(k=>ls(k,null)); AUTH.pass=""; AUTH.role=""; }
  if(!AUTH.pass){ showSignIn(); return; }
  const cached=readCache(), sig=d=>d?JSON.stringify([d.records,d.lists,Object.keys(d.tracks||{}).length,Object.keys(d.details||{}).length]):"";
  const before=sig(cached);
  if(cached&&applyLoad(cached,true)) start(); else status("Opening the store…",0);
  try{
    const d=await loadAll(); status(""); updateCount();
    if(!started) start();
    else if(sig(d)!==before){ const keepScroll=$("#rb-bscroll")?$("#rb-bscroll").scrollTop:0; $("#rb-nav").innerHTML=navHTML(); bindNav(); renderAll(); const sc=$("#rb-bscroll"); if(sc) sc.scrollTop=keepScroll; }
  }catch(e){
    const msg=String(e&&e.message||"");
    if(/passcode|sign in/i.test(msg)){ signOut(); showSignIn("Your passcode has changed. Sign in again."); return; }
    if(!started) showSignIn("The record list didn't load. Check your connection and try again.");
    else status("Showing your saved copy of the list. The sheet didn't answer just now ("+msg.slice(0,80)+").",15000);
  }
}
init();

}catch(e){var m=document.getElementById("rb-main");if(m)m.innerHTML='<p style="padding:16px;color:#b00020;font:15px sans-serif">The store hit an error: '+String(e&&e.message||e).replace(/</g,"&lt;")+'</p>';if(window.console)console.error(e);}
})();
</script>
