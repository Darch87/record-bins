<!doctype html><html><head><meta charset="utf-8"><title>jobs</title>
<style>body{font:12px monospace;background:#fff;color:#000;margin:8px}pre{white-space:pre-wrap}</style></head>
<body><div id="st">loading…</div><pre id="out" style="display:none"></pre><button id="sh" onclick="document.getElementById('out').style.display='block'">show</button>
<script>
const EXEC="https://script.google.com/macros/s/AKfycbxWSSxXlp_5k1APHeV0soOzSxFQYRXToDyMGrdQWmAJleUvU-IvjbVp54FLBpcIRDaq/exec";
const MB="https://musicbrainz.org/ws/2/";
const st=document.getElementById("st"), out=document.getElementById("out");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s||"").toLowerCase().replace(/^the\s+/,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
const words=s=>String(s||"").toLowerCase().replace(/&/g," and ").replace(/\b(ost|soundtrack|the|a|an|lp|vol|volume)\b/g," ").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>0);
function sim(a,b){ const A=words(a),B=words(b); if(!A.length||!B.length) return norm(a)===norm(b)?1:0;
  const sb=new Set(B); let hit=0; A.forEach(w=>{ if(sb.has(w)) hit++; else if([...sb].some(x=>x.length>3&&w.length>3&&(x.startsWith(w.slice(0,4))))) hit+=0.6; });
  return Math.min(1,hit/Math.max(A.length,B.length)); }
const VAR=/^(various artists|various|classical|soundtrack|orchestra)$/i;
let last=0;
async function mb(path){ const now=Date.now(); if(now-last<1050) await wait(1050-(now-last)); last=Date.now();
  for(let t=0;t<3;t++){ try{ const r=await fetch(MB+path,{headers:{Accept:"application/json"}}); if(r.status===503){ await wait(3000); continue; } return r.ok?await r.json():null; }catch(e){ await wait(2000); } } return null; }
const esc=s=>String(s).replace(/[+\-&|!(){}\[\]^"~*?:\\\/]/g," ").trim();
function q(artist,title,field){ let s=`${field}:(${esc(title)})`; if(artist&&!VAR.test(artist)) s+=` AND artist:(${esc(artist)})`; return encodeURIComponent(s); }
function pick(list,artist,title,tf){ let best=null;
  (list||[]).forEach(x=>{ const ac=(x["artist-credit"]||[]).map(c=>c.name+(c.joinphrase||"")).join("");
    const ts=sim(title,x[tf]), as=(artist&&!VAR.test(artist))?Math.max(sim(artist,ac),sim(ac,artist)):1; const sc=ts*0.65+as*0.35;
    if(!best||sc>best.sc) best={x,ac,ts,as,sc}; }); return best; }
const conf=b=>!b?"none":(b.ts>=0.9&&b.as>=0.85?"high":(b.ts>=0.6&&b.as>=0.6?"medium":"low"));
function imgOK(u){ return new Promise(res=>{ const i=new Image(); let d=false; i.onload=()=>{d=true;res(true)}; i.onerror=()=>{d=true;res(false)}; setTimeout(()=>{if(!d)res(false)},15000); i.src=u; }); }
function jsonp(url){ return new Promise((res,rej)=>{ const cb="cb"+Date.now(); window[cb]=d=>{res(d)}; const s=document.createElement("script"); s.onerror=()=>rej(new Error("blocked")); s.src=url+(url.includes("?")?"&":"?")+"callback="+cb; document.head.appendChild(s); }); }
const CK="jobs-cache-v2"; let CACHE={}; try{CACHE=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){} const save=()=>{try{localStorage.setItem(CK,JSON.stringify(CACHE))}catch(e){}};
const T=s=>String(s==null?"":s).replace(/[\t\n]/g," ");
(async()=>{
  const recs=[{"a": "Fats Waller", "t": "African Ripples", "nt": 0, "nc": 1}, {"a": "War", "t": "All Day Music", "nt": 0, "nc": 1}, {"a": "Dinah Washington", "t": "Dinah '63", "nt": 0, "nc": 1}, {"a": "Tim Weisberg", "t": "4", "nt": 0, "nc": 1}, {"a": "Barry White", "t": "Stone Gon'", "nt": 0, "nc": 1}, {"a": "Andy Williams", "t": "Newest Hits", "nt": 1, "nc": 1}, {"a": "Bob Wills", "t": "The Best of Bob Wills", "nt": 0, "nc": 1}, {"a": "Nancy Wilson", "t": "The Best of Nancy Wilson", "nt": 0, "nc": 1}, {"a": "Wishbone Ash", "t": "Front Page News", "nt": 0, "nc": 1}, {"a": "Bobby Womack", "t": "Lookin' for a Love Again", "nt": 0, "nc": 1}, {"a": "Stevie Wonder", "t": "Characters", "nt": 0, "nc": 1}, {"a": "Stevie Wonder", "t": "Fulfillingess' First Finale", "nt": 1, "nc": 0}, {"a": "Stevie Wonder", "t": "Hotter Than July", "nt": 0, "nc": 1}, {"a": "The Yardbirds", "t": "The Yardbirds Great Hits", "nt": 1, "nc": 1}, {"a": "Yes", "t": "The Yes Album", "nt": 0, "nc": 1}, {"a": "Z Z Top", "t": "Fandango!", "nt": 1, "nc": 1}, {"a": "Zapp", "t": "Zapp", "nt": 0, "nc": 1}, {"a": "Frank Zappa", "t": "Chunga's Revenge", "nt": 0, "nc": 1}].map(r=>({a:r.a,t:r.t,k:norm(r.a)+"|"+norm(r.t),nt:r.nt,nc:r.nc}));
  const tk={}; const lines=[]; const res=[]; const miss=recs; const total=miss.length; let n=0;
  const show=()=>{ st.textContent=`progress ${n}/${total}`+(n>=total?" DONE":""); }; show();
  res.push("##MISS\tartist\talbum\tneedTracks\tneedCover\tconf\tmbArtist\tmbTitle\tmbDate\tmbRelease\tnTracks\tcaaCover\tdiscogsRelease");
  for(const r of miss){ if(CACHE["M"+r.k]){ res.push(CACHE["M"+r.k]); n++; show(); continue; } const needT=!!r.nt, needC=!!r.nc;
    const dd=await mb(`release?query=${q(r.a,r.t,"release")}&fmt=json&limit=25`);
    let list=(dd&&dd.releases)||[]; const b0=pick(list,r.a,r.t,"title"); let b=b0;
    if(b0){ const sameRG=list.filter(x=>x["release-group"]&&b0.x["release-group"]&&x["release-group"].id===b0.x["release-group"].id);
      const vin=sameRG.filter(x=>(x.media||[]).some(m=>/vinyl/i.test(m.format||""))); const chosen=(vin[0]||b0.x); b=Object.assign({},b0,{x:chosen}); }
    let nT="",caa="",dg="";
    if(b&&conf(b)!=="low"){
      if(needT){ const rel=await mb(`release/${b.x.id}?inc=recordings+url-rels&fmt=json`);
        if(rel){ nT=(rel.media||[]).reduce((s,m)=>s+(m.tracks||[]).length,0); (rel.relations||[]).forEach(x=>{ const mm=(x.url&&x.url.resource||"").match(/discogs\.com\/release\/(\d+)/); if(mm) dg=mm[1]; }); } }
      if(needC&&b.x["release-group"]){ const u=`https://coverartarchive.org/release-group/${b.x["release-group"].id}/front-500`; if(await imgOK(u)) caa=u; }
    }
    res.push(["MISS",r.a,r.t,needT?1:0,needC?1:0,conf(b),b?b.ac:"",b?b.x.title:"",b?b.x.date||"":"",b?b.x.id:"",nT,caa,dg].map(T).join("\t")); CACHE["M"+r.k]=res[res.length-1]; save();
    n++; show(); out.textContent=lines.concat(res).join("\n"); }
  show();
})().catch(e=>{ st.textContent="ERROR "+e.message; });
</script></body></html>
